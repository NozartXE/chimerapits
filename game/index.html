<!DOCTYPE html>
<!--
  CHIMERA PITS — splice a beast, watch it fight, graft it stranger.
  A pit-fighting game about a beast that is rebuilt after every bout: 36 graftable
  body parts across 6 slots, 7 tag synergies, 9 wild kinds and the three-phase APEX
  over a 9-bout card, with a graft draft between bouts, applause prods, 3 stances,
  3 difficulties, an endless WILD mode, 9 feats, an almanac, and a run history that
  keeps its losses. Win: clear all 9 bouts. Lose: your beast falls.
  Tech: one HTML file, classic scripts only, canvas 2D, WebAudio synth, a DOM-free
  fixed-step simulation that replays identically from a seed in the browser and in
  Node (the balance bot plays full runs headlessly). No network, no libraries, no
  external assets — every beast is drawn from its body plan by code.
-->
